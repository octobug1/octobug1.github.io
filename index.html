
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Octobug | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #27DCE0, #9C0752);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #fff;
}

/* Make wrapper take full height and center container */
.container-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  transform: scale(0.8);
  transform-origin: center center;
}


.container {
  text-align: center;
  padding: 30px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
  border-radius: 25px;
  width: 90%;
  max-width: 480px; /* slightly smaller than before */
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(30px);} 
  to {opacity: 1; transform: translateY(0);} 
}

.profile-pic {
  width: 120px; /* smaller image */
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  border: 4px solid rgba(255,255,255,0.9);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  transform: scale(0);
  animation: popIn 1s ease forwards;
}

@keyframes popIn {
  to {transform: scale(1);} 
}

h1 {
  font-size: 2.5rem; /* smaller heading */
  margin-bottom: 12px;
}

.highlight-name {
  color: #ffe66d;
  text-shadow: 0 0 10px rgba(255,255,255,0.6);
  transition: 0.3s;
}

.highlight-name:hover {
  color: #fff;
}

p {
  font-size: 1.1rem; /* slightly smaller */
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 0.5s;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 12px; /* slightly smaller gap */
  margin-top: 10px;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 0.8s;
}

.links a {
  text-decoration: none;
  font-size: 1rem; /* smaller font */
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px; /* smaller padding */
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
  transition: 0.25s ease;
  color: #fff;
}

.links a:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-3px);
}

.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from {transform: translateY(0); opacity: 1;} 
  to {transform: translateY(-120vh); opacity: 0;} 
}

/* Responsive adjustments for very small screens */
@media (max-width: 400px) {
  .profile-pic {
    width: 100px;
    height: 100px;
  }

  h1 {
    font-size: 2rem;
  }

  p {
    font-size: 1rem;
  }

  .links a {
    font-size: 0.9rem;
    padding: 6px 12px;
  }
}

  </style>
</head>
<body>
  <div id="particles"></div>
  <div class="container-wrapper">
  <div class="container">
    <img src="images/octopus.png" alt="Octobug Logo" class="profile-pic" />
    <h1>Hi, I'm <span class="highlight-name">Octobug!</span></h1>
    <p>A security engineer and full‑stack developer specializing in web security and web development.</p>

    <div class="links">
      <a href="https://github.com/octobug1" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="mailto:octobug1@proton.me"><i class="fas fa-envelope"></i> Email</a>
      <a href="https://t.me/octobug1" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
      <a href="https://tryhackme.com/p/octobug1" target="_blank"><i class="fas fa-shield-alt"></i> TryHackMe</a>
      <a href="https://github.com/DarkSyst" target="_blank"><i class="fas fa-building"></i> Company</a>
      <a href="blog/"><i class="fas fa-pen-nib"></i> Blog (in progress)</a>
    </div>
  </div>
</div>

  </div>

  <script>
    const particles = document.getElementById('particles');
    const count = 40;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 8 + 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.bottom = '-20px';
      p.style.animationDuration = (Math.random() * 6 + 4) + 's';
      particles.appendChild(p);
    }
  </script>
</body>
</html>
